#!/usr/bin/env bash
# sunshine.conf is rewritten wholesale by Sunshine's web UI, so it cannot be a
# plain managed file — apply would clobber every setting made from the browser
# and `chezmoi status` would never come clean. Manage the one key that has to
# be there (the idle inhibitor, which nothing in the UI can express) and let
# Sunshine own the rest.
#
# Format is `key = value`, one per line; global_prep_cmd's value is a JSON
# array on a single line.
set -euo pipefail

script="${HOME}/.config/sunshine/stream-prep.sh"
prep="[{\"do\":\"${script} on\",\"undo\":\"${script} off\"}]"

# Drop any existing global_prep_cmd line, keep everything else verbatim, then
# re-assert ours at the end.
grep -v '^[[:space:]]*global_prep_cmd[[:space:]]*=' || true

printf 'global_prep_cmd = %s\n' "$prep"
