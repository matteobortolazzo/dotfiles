# Global NVIDIA/Proton defaults for every Steam game (gaming hosts only).
# environment.d feeds the systemd user manager, so niri, dms and everything
# they launch (Steam included) inherit these; a per-game launch option is then
# only needed for the exceptions. Takes effect on the next login.
# See docs/nvidia.md, "Global defaults".

# DLSS: Proton-CachyOS downloads the newest DLLs; the DRS string forces the
# latest (transformer) presets over whatever the game bundles. Inert in games
# without DLSS. Per-game opt-out: `nvrun --no-dlss %command%`.
PROTON_DLSS_UPGRADE=1
PROTON_ENABLE_NGX_UPDATER=1
PROTON_FORCE_NVAPI=1
PROTON_ENABLE_NVAPI=1
DXVK_NVAPI_DRS_SETTINGS=ngx_dlss_sr_override=on,ngx_dlss_rr_override=on,ngx_dlss_fg_override=on,ngx_dlss_sr_override_render_preset_selection=render_preset_latest,ngx_dlss_rr_override_render_preset_selection=render_preset_latest

# Frame cap a few fps under the Odyssey's 120 Hz, so VRR never hits the
# vsync wall (niri has no tearing). DXVK/vkd3d titles only; native games are
# untouched. Raise to ~230 if the panel is switched to 240 Hz. Per-game
# override: `DXVK_FRAME_RATE=0 %command%` (0 = uncapped).
DXVK_FRAME_RATE=116
