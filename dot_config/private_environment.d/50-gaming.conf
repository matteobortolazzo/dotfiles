# Global gaming defaults for every Steam game (gaming hosts only).
# environment.d feeds the systemd user manager, so niri, dms and everything
# they launch (Steam included) inherit these. Takes effect on the next login.
# See docs/nvidia.md, "Global defaults".
#
# Deliberately NOT global: the DLSS override. It is opt-in per game with
# `nvrun %command%` (verified working on ACC: DLSS 310.9.16, preset K).

# Frame cap a few fps under the Odyssey's 120 Hz, so VRR never hits the
# vsync wall (niri has no tearing). Two variables because Proton has two
# translation layers: DXVK for DX8-11 (AC, ACC), vkd3d-proton for DX12 (AC EVO,
# AC Rally). Native games are untouched. Raise both to ~230 if the panel is
# switched to 240 Hz. Per-game override: `DXVK_FRAME_RATE=0 %command%` or
# `VKD3D_FRAME_RATE=0 %command%` (0 = uncapped).
DXVK_FRAME_RATE=116
VKD3D_FRAME_RATE=116
