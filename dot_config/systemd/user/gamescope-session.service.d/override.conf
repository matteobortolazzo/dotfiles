[Service]
# Pin embedded gamescope to the 16:9 dummy plug. The launcher's default is
# `-O "*,eDP-1"` — "any connector, prefer a laptop panel" — which with both
# DP-1 (Odyssey) and DP-2 (dummy) connected picks whichever DRM enumerates
# first. Gamescope takes the output's preferred mode, so on the dummy the
# session runs 3840x2160@60 (its EDID-preferred mode).
Environment=OUTPUT_CONNECTOR=DP-2
