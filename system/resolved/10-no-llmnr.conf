# LLMNR lets any LAN peer answer a failed name lookup — the classic
# Responder-style spoofing vector. MagicDNS (tailscale) and mDNS (avahi) cover
# every name this box actually resolves, so LLMNR is pure attack surface here.
# Installed to /etc/systemd/resolved.conf.d/ by run_once_after_30-resolved.sh.tmpl.
[Resolve]
LLMNR=no
