# Managed by chezmoi (system/nut/, mirrored by run_onchange_after_51-ups.sh.tmpl).
#
# The safety net upsmon alone does not give you. upsmon shuts down when the UPS
# raises LB — but a Q* protocol UPS derives that from a battery voltage curve
# with no calibration data behind it, so LB can arrive far too late (or, on a
# tired battery, never: the unit just drops the output). The timer below makes
# the outage duration the trigger instead, and whichever fires first wins.
CMDSCRIPT /etc/nut/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Five minutes of mains loss -> shut down. Cancelled the moment power returns,
# so flickers and brownouts cost nothing.
AT ONBATT * START-TIMER onbatt-shutdown 300
AT ONLINE * CANCEL-TIMER onbatt-shutdown

# Losing the USB link is not itself a power event, but it means nothing above
# can fire any more. Log it loudly rather than silently running unprotected.
AT COMMBAD * START-TIMER commbad-warn 30
AT COMMOK  * CANCEL-TIMER commbad-warn
