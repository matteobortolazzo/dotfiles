# Managed by chezmoi (system/nut/, mirrored by run_onchange_after_51-ups.sh.tmpl).
#
# upssched runs as the unprivileged nut user and needs somewhere to put its
# pipe and lock; the nut units do not all declare a RuntimeDirectory, so the
# first ONBATT after a reboot would otherwise fail to arm the timer.
d /run/nut 0770 root nut - -

# Clear a stale killpower flag at boot ("!" = boot only). If the UPS did cut
# power, the flag is still there when we come back up, and left in place it
# would make the *next* clean shutdown kill the mains too.
r! /etc/killpower
