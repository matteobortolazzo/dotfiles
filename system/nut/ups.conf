# Managed by chezmoi (system/nut/, mirrored by run_onchange_after_51-ups.sh.tmpl).
#
# Tecnoware EXA Plus 1500 — a Megatec/Q* protocol unit behind a Cypress
# USB-to-serial bridge (0665:5161), the same silicon as the Era Plus line.
#
# vendorid/productid are NOT optional here even though `port = auto` implies a
# scan: nutdrv_qx refuses to pick a subdriver for this VID/PID on its own and
# exits with "No supported devices found" (networkupstools/nut#3410). With the
# ids pinned it autodetects the Voltronic-QS protocol and comes up clean.
#
# blazer_usb also drives this family, but it is the deprecated predecessor —
# nutdrv_qx is the maintained driver and the one upstream points new configs at.

maxretry = 3
pollinterval = 2

[exa]
  driver = nutdrv_qx
  port = auto
  vendorid = 0665
  productid = 5161
  desc = "Tecnoware EXA Plus 1500"
