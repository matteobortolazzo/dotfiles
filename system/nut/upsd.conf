# Managed by chezmoi (system/nut/, mirrored by run_onchange_after_51-ups.sh.tmpl).
#
# Loopback only. upsd speaks a plaintext protocol and the only client is the
# upsmon on this box, so there is nothing to expose — and nothing for
# 28-firewall to open. Sharing the UPS with another host means adding a LISTEN
# line here, a ufw rule for 3493, and MODE=netserver in nut.conf (docs/ups.md).
LISTEN 127.0.0.1 3493
