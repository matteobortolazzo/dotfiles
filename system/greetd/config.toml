# greetd — runs dux-greeter, which hosts its own minimal niri session as the
# greeter user (config generated by `dms-greeter sync` into /etc/greetd/niri/).
# Theme, wallpaper and colors come from the synced cache in /var/cache/dms-greeter.
# Recovery: if greetd fails on boot, switch to TTY2 (Ctrl+Alt+F2) and run
#   sudo systemctl disable --now greetd
# to fall back to plain TTY login. getty@tty1 is not masked.

[terminal]
vt = 1

[default_session]
command = "/usr/bin/dms-greeter --command niri"
user = "greeter"
