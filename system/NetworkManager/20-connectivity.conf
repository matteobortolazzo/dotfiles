# Connectivity checking — the detection half of captive-portal login.
#
# NetworkManager periodically fetches this URI and inspects the reply. A gateway
# that intercepts the request (hotel/airport/train wifi) sends back its own
# response instead, and NM moves from `full` to `portal`. That state is what
# ~/.config/niri/scripts/captive-portal-watch.sh reacts to.
#
# The Arch package already ships an identical stanza in
# /usr/lib/NetworkManager/conf.d/20-connectivity.conf. This file has the same
# basename on purpose: a matching name under /etc shadows the one under
# /usr/lib entirely, so the behaviour is pinned here rather than inherited from
# whatever the package decides to ship next.
#
# Installed by run_once_after_29-captive-portal.sh.tmpl.

[connectivity]
enabled=true

# Plain HTTP is required, not an oversight: a gateway can only rewrite an
# unencrypted response, and that rewrite is the whole signal.
uri=http://ping.archlinux.org/nm-check.txt

# `response` is deliberately unset. With no expected body configured, NM instead
# requires the `X-NetworkManager-Status: online` header — which the URI above
# sends. Setting a body string that doesn't match byte-for-byte would report a
# portal on every network, so leave this alone unless the URI changes too.

# How often to re-check while connected (seconds; NM's own default is 300).
# The check that matters runs when a connection comes up, so this interval only
# governs how fast an *expiring* portal session is noticed — hotel wifi that
# logs you out hourly. 120s keeps that responsive without meaningful traffic.
interval=120
