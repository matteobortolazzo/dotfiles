# Installed to /etc/NetworkManager/conf.d/10-dns-systemd-resolved.conf by
# run_once_after_23-tailscale.sh.tmpl. Sits alongside 20-connectivity.conf,
# which 29-captive-portal installs — different sections, so NM merges both.
#
# Without this, NetworkManager writes /etc/resolv.conf as a regular file and
# Tailscale's health check reports "systemd-resolved and NetworkManager are
# wired together incorrectly; MagicDNS will probably not work".
#
# The default arrangement happens to work — NM writes nameserver 127.0.0.53,
# which is systemd-resolved's stub, so MagicDNS lookups reach 100.100.100.100
# via the tailscale0 link. It is fragile rather than broken: NM owns that file
# and rewrites it on interface changes, so a reconnect can replace the stub
# with the router's DNS. Then MagicDNS stops resolving and nothing logs why.
#
# dns=systemd-resolved  — push DHCP-learned servers into resolved (per-link)
#                         instead of flattening every interface into one file.
#                         Per-link scoping is what lets resolved send *.ts.net
#                         to tailscale0 and everything else to the LAN.
# rc-manager=unmanaged  — keep NM's hands off /etc/resolv.conf entirely so the
#                         symlink to resolved's stub survives. The script
#                         creates that symlink.
[main]
dns=systemd-resolved
rc-manager=unmanaged
