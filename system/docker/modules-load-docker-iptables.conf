# Netfilter modules Docker needs to create its NAT chain. systemd >= 259
# dropped automatic legacy-iptables module loading (nftables-only backend for
# systemd-networkd/nspawn), so on current Arch these no longer load on their
# own — surfaced as sysbox-runc dockerd failing with:
#   "failed to create NAT chain DOCKER: iptables failed ... can't load module
#   ip_tables ... Operation not permitted"
# Containers (sysbox or otherwise) can never load kernel modules themselves;
# these must already be loaded on the host.
ip_tables
iptable_nat
ip6_tables
ip6table_nat
nf_nat
